name: Cadence
options:
  bundleIdPrefix: com.ryanpark
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.5.4"
    CURRENT_PROJECT_VERSION: "10"
targets:
  Cadence:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanpark.cadence
        PRODUCT_NAME: Cadence
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # Signed by the last build step instead (scripts/sign-mac.sh): with the permanent local certificate when
        # this Mac has one, so permissions survive rebuilds; ad hoc otherwise (e.g. the release build).
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Cadence reads the address of your browser's current tab so it can block the websites you chose while a strict task is overdue or during a focus session."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    postBuildScripts:
      - name: Sign
        script: '"$SRCROOT/scripts/sign-mac.sh"'
        basedOnDependencyAnalysis: false
  CadenceMobile:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Sources/Model
      - path: Sources/Shared
      - path: Sources/Services/SyncService.swift
      - path: Sources/Services/GoogleAuth.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanpark.cadence.ios
        PRODUCT_NAME: Cadence
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
