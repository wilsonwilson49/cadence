name: Cadence
options:
  bundleIdPrefix: com.ryanpark
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.5.1"
    CURRENT_PROJECT_VERSION: "7"
targets:
  Cadence:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanpark.cadence
        PRODUCT_NAME: Cadence
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CadenceMobile:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Sources/Model
      - path: Sources/Services/SyncService.swift
      - path: Sources/Services/GoogleAuth.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanpark.cadence.ios
        PRODUCT_NAME: Cadence
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
