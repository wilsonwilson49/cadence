<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blocked · Cadence</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbfaf7">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/legal.css">
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="/"><img src="/apple-touch-icon.png" alt="">Cadence</a>
</div></header>
<main class="wrap blocked">
  <div>
    <div class="lock"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1 id="title">This site is blocked</h1>
    <p class="why" id="why">The Cadence Mac app is blocking it.</p>
    <a class="btn primary lg" href="/app/today">Open today's list</a>
    <p class="fine">Blocking is set in the Cadence Mac app, under Settings › Tough love.</p>
  </div>
</main>
<script>
  // The Mac app sends blocked tabs here: /blocked?site=youtube.com&why=until you finish “Essay”
  const q = new URLSearchParams(location.search);
  const site = q.get('site'), why = q.get('why');
  if (site) document.getElementById('title').textContent = `${site} is blocked`;
  if (why) document.getElementById('why').textContent = `Blocked ${why}.`;
</script>
</body>
</html>
